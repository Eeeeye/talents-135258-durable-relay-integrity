version = "1.0"

[task]
name = "talents/durable-relay-integrity"
description = "Repair cross-layer durability, reload, atomic-publication, and idempotency failures in an offline Go artifact relay."
authors = [{ name = "Talents task author" }]
keywords = ["go", "durability", "wal", "concurrency", "idempotency", "atomic-files"]

[metadata]
difficulty = "expert"
difficulty_explanation = "L4: a human expert must establish one coherent acceptance and durability order across HTTP admission, Unicode-normalized idempotency, concurrent WAL sequencing, snapshot rotation, atomic filesystem publication, receipts, live reload, and crash recovery. An agent must diagnose interacting failures across these layers from black-box symptoms, preserve the public wire and DRW1 formats, reject tempting local fixes that introduce new crash windows, and validate nondeterministic concurrency and restart behavior without network access or new dependencies."
category = "systems-engineering"
tags = ["go", "durability", "wal", "concurrency", "idempotency", "atomic-files"]
