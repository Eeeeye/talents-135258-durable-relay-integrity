version = "1.0"

[task]
name = "talents/durable-relay-integrity"
description = "Repair cross-layer durability, reload, atomic-publication, and idempotency failures in an offline Go artifact relay."
authors = [{ name = "Talents task author" }]
keywords = ["go", "durability", "wal", "concurrency", "idempotency", "atomic-files"]

[metadata]
difficulty = "expert"
difficulty_explanation = "L4: a human expert must establish one coherent acceptance and durability order across HTTP admission, Unicode-normalized idempotency, concurrent WAL sequencing, snapshot rotation, atomic filesystem publication, receipts, live reload, and crash recovery. An agent must diagnose interacting failures across these layers from black-box symptoms, preserve the public wire and DRW1 formats, reject tempting local fixes that introduce new crash windows, and validate nondeterministic concurrency and restart behavior without network access or new dependencies."
solution_explanation = "The reference repair establishes a single recoverable order across admission, WAL publication, snapshot cutover, artifact replacement, success persistence, and receipt reconciliation. It atomically swaps live configuration, reserves queue capacity before claiming an idempotency key, serializes WAL sequence/state/snapshot operations, rejects damaged durable input, publishes through a validated same-directory temporary file, records durable success before an idempotent receipt, and reschedules only nonterminal jobs after restart."
verification_explanation = "A trusted Go verifier builds fresh candidate binaries, runs the complete HTTP, CLI, filesystem, crash, restart, corruption, and concurrency matrix twice under distinct cryptographically random process identities and opaque directories, and independently decodes DRW1 WAL frames, snapshots, artifacts, and receipts. Canonical-only recovery and byte-preserving fail-closed cases reject sidecars and repair-on-read shortcuts. Reload timing uses persisted retry_wait-to-running timestamps rather than verifier wake-up time: every sample enforces the new minimum, randomized fast and slow bases occupy disjoint ranges, and only the fastest of three samples must start within a conservative 250 ms scheduling allowance while a separate five-second liveness margin absorbs transient load. Candidate unit tests run last in an isolated process group."
category = "systems-engineering"
tags = ["go", "durability", "wal", "concurrency", "idempotency", "atomic-files"]
activity_id = "135258"
source_sha256 = "872791c69307abb76f1b1facfa2b93da3c071a7a8d20eba5ff3712dd1ccf6a94"
expert_time_estimate_min = 240.0

[verifier]
timeout_sec = 420.0

[agent]
timeout_sec = 1200.0

[environment]
build_timeout_sec = 600.0
cpus = 4
memory_mb = 4096
storage_mb = 8192
allow_internet = true
workdir = "/app"
